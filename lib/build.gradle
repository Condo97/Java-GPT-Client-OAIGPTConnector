plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.condo97'
version = System.getenv('VERSION') ?: '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Dotenv for env
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    // Javalin for HTTPS server
    implementation 'com.sparkjava:spark-core:2.9.4'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.1-jre'

    // Logging for Spark
    implementation 'org.apache.logging.log4j:log4j:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'

    // Jackson for JSONs
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.0.1'

    // MySQL Connector
    implementation 'mysql:mysql-connector-java:8.0.30'

    // java-jwt for JWT
    implementation 'com.auth0:java-jwt:4.4.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
            artifactId = 'oaigptconnector'
            
            pom {
                name = 'OAIGPTConnector'
                description = 'Java client library for OpenAI GPT API with function calling support'
                url = 'https://github.com/Condo97/Java-GPT-Client-OAIGPTConnector'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'condo97'
                        name = 'Condo97'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/Condo97/Java-GPT-Client-OAIGPTConnector.git'
                    developerConnection = 'scm:git:ssh://github.com/Condo97/Java-GPT-Client-OAIGPTConnector.git'
                    url = 'https://github.com/Condo97/Java-GPT-Client-OAIGPTConnector'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Condo97/Java-GPT-Client-OAIGPTConnector")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.token") ?: ""
            }
        }
    }
}
